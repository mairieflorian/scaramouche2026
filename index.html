<head>

  <title>Scaramouche 2026 — Tableaux Éliminatoires</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #eef2f6;
      color: #0f172a;
      line-height: 1.4;
    }
    .container { max-width: 1520px; margin: 0 auto; }
    header {
      background: #0f172a;
      color: #fff;
      padding: 16px;
      border-bottom: 4px solid #0f766e;
    }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .kicker { font-size: 11.5px; font-weight: 800; color: #5eead4; text-transform: uppercase; }
    .title { font-size: 21px; font-weight: 800; margin-top: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .badge {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(148, 163, 184, 0.22);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.45);
    }
    .badge.editor {
      background: rgba(20, 184, 166, 0.25);
      color: #5eead4;
      border-color: #2dd4bf;
    }
    button, .btn-label {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover, .btn-label:hover { background: rgba(255, 255, 255, 0.2); }
    .btn-pin { background: #0d9488; border-color: #2dd4bf; }

    .tabs-bar { background: #1e293b; padding: 10px 16px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab-btn {
      background: #0f172a;
      color: #cbd5e1;
      border: 1.5px solid #475569;
      padding: 8px 15px;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 700;
    }
    .tab-btn.active {
      background: #14b8a6;
      color: #042f2e;
      border-color: #14b8a6;
    }

    .toolbar {
      background: #fff;
      border-bottom: 1.5px solid #cbd5e1;
      padding: 10px 16px;
    }
    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .sub-btn {
      background: #f8fafc;
      color: #0f172a;
      border: 1.5px solid #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .sub-btn.active { background: #0f172a; color: #fff; }
    .search {
      padding: 7px 12px;
      border: 1.5px solid #94a3b8;
      border-radius: 6px;
      font-size: 13px;
      min-width: 230px;
    }

    main { padding: 20px 16px 48px; }
    .sheet {
      background: #fff;
      border: 2px solid #1e293b;
      border-radius: 6px;
      padding: 16px;
    }
    .sheet-top {
      display: grid;
      grid-template-columns: 1.2fr 1.5fr 1fr;
      border: 1.5px solid #1e293b;
      margin-bottom: 14px;
    }
    .box {
      padding: 10px 12px;
      border-right: 1.5px solid #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .box:last-child { border-right: none; }
    .tour-title { font-size: 20px; font-weight: 800; }
    .center-title { font-size: 16px; font-weight: 800; text-align: center; }
    .center-sub { font-size: 12.5px; color: #475569; font-weight: 700; text-align: center; }
    .right-club { text-align: right; font-size: 13px; font-weight: 800; }
    .right-date { text-align: right; font-size: 12px; color: #475569; font-weight: 600; }

    .meta-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; }
    .meta-row input {
      border: 1px solid #94a3b8;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 12.5px;
      font-weight: 700;
      background: #f8fafc;
      color: #0f172a;
    }
    .meta-row input:disabled { background: #f1f5f9; border-color: transparent; }

    .scroll { overflow-x: auto; padding-bottom: 8px; }
    .board {
      display: grid;
      gap: 14px;
      align-items: stretch;
    }
    .board.cols-5 {
      min-width: 1180px;
      grid-template-columns: repeat(5, 1fr);
    }
    .board.cols-6 {
      min-width: 1380px;
      grid-template-columns: repeat(6, 1fr);
    }
    .col-wrap {
      display: flex;
      flex-direction: column;
    }
    .col-title {
      background: #0f172a;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 7px 8px;
      border-radius: 5px;
      text-align: center;
      margin-bottom: 10px;
    }
    .col-matches {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 8px;
    }
    .match {
      border: 1.5px solid #1e293b;
      border-radius: 5px;
      background: #f8fafc;
      overflow: hidden;
    }
    .match-head {
      background: #e2e8f0;
      padding: 2px 7px;
      font-size: 10.5px;
      font-weight: 800;
      color: #334155;
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }
    .slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 7px;
      background: #fff;
      border-top: 1px solid #cbd5e1;
      font-size: 11.5px;
    }
    .slot.win { background: #dcfce7; }
    .slot.bye { background: #f8fafc; color: #64748b; font-style: italic; }
    .slot.hit { background: #fef9c3 !important; }
    .fencer-name { font-weight: 800; }
    .fencer-club { display: block; font-size: 10px; color: #64748b; }
    .score-in {
      width: 40px;
      height: 22px;
      text-align: center;
      border: 1.5px solid #64748b;
      border-radius: 4px;
      font-weight: 800;
      font-size: 11.5px;
    }
    .score-txt { font-weight: 800; min-width: 20px; text-align: center; }

    .podium-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .qual-card {
      border: 2px solid #0f766e;
      background: #f0fdfa;
      border-radius: 6px;
      padding: 10px 12px;
      text-align: center;
    }
    .qual-card.gold {
      border-color: #b45309;
      background: #fffbeb;
    }
    .qual-card.silver {
      border-color: #475569;
      background: #f8fafc;
    }
    .qual-card.bronze {
      border-color: #9a3412;
      background: #fff7ed;
    }
    .qual-lbl { font-size: 10.5px; font-weight: 800; color: #0f766e; text-transform: uppercase; }
    .qual-card.gold .qual-lbl { color: #b45309; }
    .qual-card.silver .qual-lbl { color: #334155; }
    .qual-card.bronze .qual-lbl { color: #9a3412; }
    .qual-name { font-size: 13px; font-weight: 800; margin-top: 4px; }
    .qual-club { font-size: 11px; color: #475569; font-weight: 700; margin-top: 2px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 10px; }
    th { background: #f1f5f9; text-align: left; font-size: 11.5px; text-transform: uppercase; }
    td.num, th.num { text-align: center; }

    @media (max-width: 740px) {
      .sheet-top { grid-template-columns: 1fr; }
      .box { border-right: none; border-bottom: 1.5px solid #1e293b; }
      .box:last-child { border-bottom: none; }
      .right-club, .right-date { text-align: left; }
    }
  </style>
</head>

          25: { n: 25, nom: "LEFORT", prenom: "Madina", club: "VALLET" },
          26: { n: 26, nom: "SOURINTHA", prenom: "Maé", club: "VALLET" },
          27: { n: 27, nom: "MOALIC", prenom: "Bae", club: "VALLET" }
        },
        pairs32: [
          [1, null, "a"], [17, 16, ""], [9, 24, ""], [25, 8, ""],
          [5, null, "a"], [21, 12, ""], [13, 20, ""], [null, 4, "b"],
          [3, null, "a"], [19, 14, ""], [11, 22, ""], [27, 6, ""],
          [7, 26, ""], [23, 10, ""], [15, 18, ""], [null, 2, "b"]
        ],
        scores: {}
      }
    };

    let editorUnlocked = false;
    let currentTab = "EDM15";
    let currentView = "bracket";
    let queryText = "";

    function applyImportedObject(parsed) {
      if (!parsed || typeof parsed !== "object") return false;
      let matched = false;
      ORDER.forEach(k => {
        if (parsed[k] && typeof parsed[k] === "object") {
          matched = true;
          DATA[k].piste = typeof parsed[k].piste === "string" ? parsed[k].piste : "";
          DATA[k].arbitre = typeof parsed[k].arbitre === "string" ? parsed[k].arbitre : "";
          DATA[k].scores = parsed[k].scores && typeof parsed[k].scores === "object" ? parsed[k].scores : {};
          if (parsed[k].seeds && typeof parsed[k].seeds === "object" && Object.keys(parsed[k].seeds).length > 0) {
            DATA[k].seeds = parsed[k].seeds;
            DATA[k].active = true;
          }
          if (Array.isArray(parsed[k].pairs32) && parsed[k].pairs32.length > 0) {
            DATA[k].pairs32 = parsed[k].pairs32;
          }
          if (Array.isArray(parsed[k].pairs16) && parsed[k].pairs16.length > 0) {
            DATA[k].pairs16 = parsed[k].pairs16;
          }
        }
      });
      if (matched && (!DATA[currentTab] || !DATA[currentTab].active)) {
        const firstActive = ORDER.find(k => DATA[k] && DATA[k].active);
        if (firstActive) currentTab = firstActive;
      }
      return matched;
    }

    function fetchPublishedJson(showMsg) {
      if (window.location.protocol === "file:" || typeof fetch !== "function") {
        if (showMsg) alert("Le chargement automatique en ligne fonctionne via GitHub / Vercel.");
        return;
      }
      fetch("./resultats.json?t=" + Date.now(), { cache: "no-store" })
        .then(res => {
          if (!res.ok) {
            if (showMsg) alert("Le fichier resultats.json n'est pas encore présent sur le serveur.");
            return null;
          }
          return res.json();
        })
        .then(parsed => {
          if (!parsed) return;
          if (applyImportedObject(parsed)) {
            renderAll();
            if (showMsg) alert("Résultats chargés depuis resultats.json.");
          } else if (showMsg) {
            alert("Le fichier resultats.json est vide ou ne contient pas les clés attendues.");
          }
        })
        .catch(() => {
          if (showMsg) alert("Impossible de charger resultats.json.");
        });
    }

    function askPin() {
      const val = prompt("Code PIN pour activer la saisie :");
      if (val === null) return;
      if (val.trim() === PIN_CODE) {
        editorUnlocked = true;
        renderAll();
      } else {
        alert("Code PIN incorrect.");
      }
    }

    function lockPin() {
      editorUnlocked = false;
      renderAll();
    }

    function outcomeOf(fA, fB, sA, sB, bye) {
      if (bye === "a" && fA) return { win: fA, lose: null };
      if (bye === "b" && fB) return { win: fB, lose: null };
      if (sA === "" || sB === "") return { win: null, lose: null };
      const a = Number(sA);
      const b = Number(sB);
      if (Number.isNaN(a) || Number.isNaN(b) || a === b) return { win: null, lose: null };
      if (a > b && fA) return { win: fA, lose: fB || null };
      if (b > a && fB) return { win: fB, lose: fA || null };
      return { win: null, lose: null };
    }

    function buildRound(pairs, prefix, seeds, scores) {
      return pairs.map(([rawA, rawB, bye, customLabel], i) => {
        const key = `${prefix}.${i + 1}`;
        const fA = typeof rawA === "number" ? seeds[rawA] : (rawA || null);
        const fB = typeof rawB === "number" ? seeds[rawB] : (rawB || null);
        const sc = scores[key] || { a: "", b: "" };
        const res = outcomeOf(fA, fB, sc.a, sc.b, bye || "");
        return {
          key,
          label: customLabel || key,
          fA,
          fB,
          a: sc.a ?? "",
          b: sc.b ?? "",
          win: res.win,
          lose: res.lose,
          bye: bye || ""
        };
      });
    }

    function getRounds(ev) {
      if (ev.size === 32) {
        const r32 = buildRound(ev.pairs32, "1-32", ev.seeds, ev.scores);
        const p16 = [];
        for (let i = 0; i < 16; i += 2) p16.push([r32[i].win, r32[i + 1].win, ""]);
        const r16 = buildRound(p16, "1-16", ev.seeds, ev.scores);
        const p8 = [];
        for (let i = 0; i < 8; i += 2) p8.push([r16[i].win, r16[i + 1].win, ""]);
        const r8 = buildRound(p8, "1-8", ev.seeds, ev.scores);
        const p4 = [];
        for (let i = 0; i < 4; i += 2) p4.push([r8[i].win, r8[i + 1].win, ""]);
        const r4 = buildRound(p4, "1-4", ev.seeds, ev.scores);

        const finals = buildRound([
          [r4[0].win, r4[1].win, "", "Finale (1-2)"],
          [r4[0].lose, r4[1].lose, "", "Petite finale (3e place)"]
        ], "FIN", ev.seeds, ev.scores);

        return {
          cols: [
            { title: "Tableau de 32", matches: r32 },
            { title: "Tableau de 16", matches: r16 },
            { title: "Tableau de 8", matches: r8 },
            { title: "Demi-finales", matches: r4 },
            { title: "Finale & 3e place", matches: finals }
          ],
          podium: [
            { rank: "1er — Vainqueur", cls: "gold", fencer: finals[0].win },
            { rank: "2e — Finaliste", cls: "silver", fencer: finals[0].lose },
            { rank: "3e place", cls: "bronze", fencer: finals[1].win }
          ]
        };
      }

      const r16 = buildRound(ev.pairs16, "1-16", ev.seeds, ev.scores);
      const r8 = buildRound([
        [r16[0].win, r16[1].win, ""],
        [r16[2].win, r16[3].win, ""],
        [r16[4].win, r16[5].win, ""],
        [r16[6].win, r16[7].win, ""]
      ], "1-8", ev.seeds, ev.scores);
      const r4 = buildRound([
        [r8[0].win, r8[1].win, ""],
        [r8[2].win, r8[3].win, ""]
      ], "1-4", ev.seeds, ev.scores);

      const finals = buildRound([
        [r4[0].win, r4[1].win, "", "Finale (1-2)"],
        [r4[0].lose, r4[1].lose, "", "Petite finale (3e place)"]
      ], "FIN", ev.seeds, ev.scores);

      return {
        cols: [
          { title: "Tableau de 16", matches: r16 },
          { title: "Tableau de 8", matches: r8 },
          { title: "Demi-finales", matches: r4 },
          { title: "Finale & 3e place", matches: finals }
        ],
        podium: [
          { rank: "1er — Vainqueur", cls: "gold", fencer: finals[0].win },
          { rank: "2e — Finaliste", cls: "silver", fencer: finals[0].lose },
          { rank: "3e place", cls: "bronze", fencer: finals[1].win }
        ]
      };
    }

    function isHit(f, q) {
      if (!q || !f) return false;
      return `${f.nom} ${f.prenom} ${f.club}`.toLowerCase().includes(q);
    }

    function renderActions() {
      const el = document.getElementById("actionsBar");
      if (!editorUnlocked) {
        el.innerHTML = `
          <span class="badge">Mode Spectateur (lecture seule)</span>
          <button onclick="fetchPublishedJson(true)">Actualiser en ligne</button>
          <button onclick="window.print()">Imprimer</button>
          <button class="btn-pin" onclick="askPin()">Mode Saisie (PIN)</button>
        `;
      } else {
        el.innerHTML = `
          <span class="badge editor">Mode Saisie actif</span>
          <button onclick="fetchPublishedJson(true)">Charger resultats.json (en ligne)</button>
          <button onclick="exportJson()">Exporter JSON</button>
          <label class="btn-label">Importer JSON local <input type="file" accept=".json" style="display:none" onchange="importJson(event)" /></label>
          <button onclick="lockPin()">Verrouiller</button>
        `;
      }
    }

    function renderTabs() {
      const el = document.getElementById("tabsBar");
      el.innerHTML = ORDER
        .map(id => DATA[id])
        .filter(ev => ev && ev.active)
        .map(ev => `<button class="tab-btn ${ev.id === currentTab ? "active" : ""}" onclick="switchTab('${ev.id}')">${ev.tab}</button>`)
        .join("");
    }

    function renderSub() {
      const ev = DATA[currentTab];
      const nb = Object.keys(ev.seeds).length;
      document.getElementById("subBar").innerHTML = `
        <button class="sub-btn ${currentView === "bracket" ? "active" : ""}" onclick="switchView('bracket')">Tableau éliminatoire</button>
        <button class="sub-btn ${currentView === "list" ? "active" : ""}" onclick="switchView('list')">Participants (${nb})</button>
      `;
    }

    function slotHtml(f, score, side, isWin, hit, bye, matchKey, waitText) {
      if (!f && bye) return `<div class="slot bye"><span>Exempté</span></div>`;
      if (!f) return `<div class="slot bye"><span>${waitText || "En attente du tour précédent"}</span></div>`;
      const id = `in-${currentTab}-${matchKey}-${side}`;
      const ctrl = editorUnlocked
        ? `<input id="${id}" class="score-in" type="number" min="0" max="15" value="${score}" oninput="setScore('${matchKey}','${side}',this.value)" />`
        : `<span class="score-txt">${score !== "" ? score : "·"}</span>`;
      return `
        <div class="slot ${isWin ? "win" : ""} ${hit ? "hit" : ""}">
          <div>
            <span class="fencer-name">${f.n}. ${f.nom} ${f.prenom}</span>
            <span class="fencer-club">${f.club}</span>
          </div>
          ${ctrl}
        </div>
      `;
    }

    function renderContent() {
      const ev = DATA[currentTab];
      const q = queryText.trim().toLowerCase();
      const area = document.getElementById("contentArea");

      if (currentView === "list") {
        const rows = Object.values(ev.seeds)
          .sort((a, b) => a.n - b.n)
          .filter(f => !q || isHit(f, q))
          .map(f => `<tr><td class="num"><strong>${f.n}</strong></td><td><strong>${f.nom}</strong> ${f.prenom}</td><td>${f.club}</td></tr>`)
          .join("");
        area.innerHTML = `
          <article class="sheet">
            <div class="sheet-top">
              <div class="box"><div class="tour-title">${ev.tour}</div></div>
              <div class="box"><div class="center-title">${ev.epreuve}</div><div class="center-sub">Liste des inscrits</div></div>
              <div class="box"><div class="right-club">${ev.club}</div><div class="right-date">${ev.date}</div></div>
            </div>
            <table><thead><tr><th class="num">N°</th><th>Tireur / Tireuse</th><th>Club</th></tr></thead><tbody>${rows}</tbody></table>
          </article>
        `;
        return;
      }

      const { cols, podium } = getRounds(ev);
      const gridClass = cols.length === 5 ? "cols-6" : "cols-5";

      const colsHtml = cols.map(col => `
        <div class="col-wrap">
          <div class="col-title">${col.title}</div>
          <div class="col-matches">
            ${col.matches.map(m => {
              const aWin = m.win && m.fA && m.win.n === m.fA.n;
              const bWin = m.win && m.fB && m.win.n === m.fB.n;
              const isThirdPlace = m.key === "FIN.2";
              const waitA = isThirdPlace ? "Perdant Demi-finale 1" : "En attente du tour précédent";
              const waitB = isThirdPlace ? "Perdant Demi-finale 2" : "En attente du tour précédent";
              return `
                <div class="match">
                  <div class="match-head"><span>${m.label}</span><span>${m.win ? `Vainqueur : ${m.win.nom}` : (m.bye ? "Direct" : "")}</span></div>
                  ${slotHtml(m.fA, m.a, "a", aWin, isHit(m.fA, q), m.bye, m.key, waitA)}
                  ${slotHtml(m.fB, m.b, "b", bWin, isHit(m.fB, q), m.bye, m.key, waitB)}
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `).join("");

      const podiumHtml = `
        <div class="col-wrap">
          <div class="col-title">Podium</div>
          <div class="col-matches">
            <div class="podium-stack">
              ${podium.map(p => `
                <div class="qual-card ${p.cls}">
                  <div class="qual-lbl">${p.rank}</div>
                  ${p.fencer
                    ? `<div class="qual-name">${p.fencer.n}. ${p.fencer.nom} ${p.fencer.prenom}</div><div class="qual-club">${p.fencer.club}</div>`
                    : `<div class="qual-club">À déterminer</div>`}
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;

      area.innerHTML = `
        <article class="sheet">
          <div class="sheet-top">
            <div class="box">
              <div class="tour-title">${ev.tour}</div>
              <div class="meta-row">Piste : <input type="text" value="${ev.piste}" ${editorUnlocked ? "" : "disabled"} oninput="DATA[currentTab].piste=this.value" /></div>
            </div>
            <div class="box">
              <div class="meta-row">Arbitre : <input type="text" value="${ev.arbitre}" ${editorUnlocked ? "" : "disabled"} oninput="DATA[currentTab].arbitre=this.value" /></div>
              <div class="center-title">${ev.epreuve}</div>
              <div class="center-sub">${editorUnlocked ? "Saisie active (PIN) — qualification auto jusqu'à la finale et 3e place" : "Mode Spectateur (lecture seule)"}</div>
            </div>
            <div class="box">
              <div class="right-club">${ev.club}</div>
              <div class="right-date">${ev.date}</div>
            </div>
          </div>
          <div class="scroll"><div class="board ${gridClass}">${colsHtml}${podiumHtml}</div></div>
        </article>
      `;
    }

    function switchTab(id) {
      if (!DATA[id] || !DATA[id].active) return;
      currentTab = id;
      currentView = "bracket";
      renderAll();
    }

    function switchView(v) {
      currentView = v;
      renderSub();
      renderContent();
    }

    function onSearch(v) {
      queryText = v;
      renderContent();
    }

    function setScore(matchKey, side, val) {
      if (!editorUnlocked) return;
      const ev = DATA[currentTab];
      if (!ev.scores[matchKey]) ev.scores[matchKey] = { a: "", b: "" };
      ev.scores[matchKey][side] = val;
      const prevId = document.activeElement ? document.activeElement.id : "";
      renderContent();
      if (prevId) {
        const el = document.getElementById(prevId);
        if (el) el.focus();
      }
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "resultats.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJson(e) {
      if (!editorUnlocked) return;
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        try {
          const parsed = JSON.parse(evt.target.result);
          if (applyImportedObject(parsed)) {
            renderAll();
            alert("Résultats importés avec succès.");
          } else {
            alert("Format de fichier JSON non reconnu.");
          }
        } catch {
          alert("Fichier JSON invalide.");
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    }

    function renderAll() {
      renderActions();
      renderTabs();
      renderSub();
      renderContent();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        renderAll();
        fetchPublishedJson(false);
      });
    } else {
      renderAll();
      fetchPublishedJson(false);
    }
  </script>
</body>
</html>
