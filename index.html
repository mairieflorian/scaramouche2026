<html lang="fr">
<head>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #eef2f6;
      color: #0f172a;
      line-height: 1.4;
    }
    .container { max-width: 1360px; margin: 0 auto; }
    header {
      background: #0f172a;
      color: #fff;
      padding: 16px;
      border-bottom: 4px solid #0f766e;
    }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .kicker { font-size: 11.5px; font-weight: 800; color: #5eead4; text-transform: uppercase; }
    .title { font-size: 21px; font-weight: 800; margin-top: 2px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .badge {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      background: rgba(148, 163, 184, 0.22);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.45);
    }
    .badge.editor {
      background: rgba(20, 184, 166, 0.25);
      color: #5eead4;
      border-color: #2dd4bf;
    }
    button, .btn-label {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover, .btn-label:hover { background: rgba(255, 255, 255, 0.2); }
    .btn-pin { background: #0d9488; border-color: #2dd4bf; }

    .tabs-bar { background: #1e293b; padding: 10px 16px; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab-btn {
      background: #0f172a;
      color: #cbd5e1;
      border: 1.5px solid #475569;
      padding: 8px 15px;
      border-radius: 7px;
      font-size: 13.5px;
      font-weight: 700;
    }
    .tab-btn.active {
      background: #14b8a6;
      color: #042f2e;
      border-color: #14b8a6;
    }

    .toolbar {
      background: #fff;
      border-bottom: 1.5px solid #cbd5e1;
      padding: 10px 16px;
    }
    .toolbar-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .sub-btn {
      background: #f8fafc;
      color: #0f172a;
      border: 1.5px solid #1e293b;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }
    .sub-btn.active { background: #0f172a; color: #fff; }
    .search {
      padding: 7px 12px;
      border: 1.5px solid #94a3b8;
      border-radius: 6px;
      font-size: 13px;
      min-width: 230px;
    }

    main { padding: 20px 16px 48px; }
    .sheet {
      background: #fff;
      border: 2px solid #1e293b;
      border-radius: 6px;
      padding: 16px;
    }
    .sheet-top {
      display: grid;
      grid-template-columns: 1.2fr 1.5fr 1fr;
      border: 1.5px solid #1e293b;
      margin-bottom: 14px;
    }
    .box {
      padding: 10px 12px;
      border-right: 1.5px solid #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }
    .box:last-child { border-right: none; }
    .tour-title { font-size: 20px; font-weight: 800; }
    .center-title { font-size: 16px; font-weight: 800; text-align: center; }
    .center-sub { font-size: 12.5px; color: #475569; font-weight: 700; text-align: center; }
    .right-club { text-align: right; font-size: 13px; font-weight: 800; }
    .right-date { text-align: right; font-size: 12px; color: #475569; font-weight: 600; }

    .meta-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; }
    .meta-row input {
      border: 1px solid #94a3b8;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 12.5px;
      font-weight: 700;
      background: #f8fafc;
      color: #0f172a;
    }
    .meta-row input:disabled { background: #f1f5f9; border-color: transparent; }

    .scroll { overflow-x: auto; padding-bottom: 8px; }
    .board {
      min-width: 1020px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .col-title {
      background: #0f172a;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 7px 8px;
      border-radius: 5px;
      text-align: center;
      margin-bottom: 10px;
    }
    .col-matches { display: flex; flex-direction: column; justify-content: space-around; gap: 8px; }
    .match {
      border: 1.5px solid #1e293b;
      border-radius: 5px;
      background: #f8fafc;
      overflow: hidden;
    }
    .match-head {
      background: #e2e8f0;
      padding: 2px 7px;
      font-size: 10.5px;
      font-weight: 800;
      color: #334155;
      display: flex;
      justify-content: space-between;
    }
    .slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 5px 7px;
      background: #fff;
      border-top: 1px solid #cbd5e1;
      font-size: 11.5px;
    }
    .slot.win { background: #dcfce7; }
    .slot.bye { background: #f8fafc; color: #64748b; font-style: italic; }
    .slot.hit { background: #fef9c3 !important; }
    .fencer-name { font-weight: 800; }
    .fencer-club { display: block; font-size: 10px; color: #64748b; }
    .score-in {
      width: 40px;
      height: 22px;
      text-align: center;
      border: 1.5px solid #64748b;
      border-radius: 4px;
      font-weight: 800;
      font-size: 11.5px;
    }
    .score-txt { font-weight: 800; min-width: 20px; text-align: center; }
    .qual-card {
      border: 2px solid #0f766e;
      background: #f0fdfa;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }
    .qual-lbl { font-size: 10.5px; font-weight: 800; color: #0f766e; text-transform: uppercase; }
    .qual-name { font-size: 13.5px; font-weight: 800; margin-top: 4px; }
    .qual-club { font-size: 11.5px; color: #475569; font-weight: 700; margin-top: 2px; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #cbd5e1; padding: 8px 10px; }
    th { background: #f1f5f9; text-align: left; font-size: 11.5px; text-transform: uppercase; }
    td.num, th.num { text-align: center; }

    @media (max-width: 740px) {
      .sheet-top { grid-template-columns: 1fr; }
      .box { border-right: none; border-bottom: 1.5px solid #1e293b; }
      .box:last-child { border-bottom: none; }
      .right-club, .right-date { text-align: left; }
    }
  </style>
</head>

    function applyImportedObject(parsed) {
      if (!parsed || typeof parsed !== "object") return false;
      let matched = false;
      ORDER.forEach(k => {
        if (parsed[k] && typeof parsed[k] === "object") {
          matched = true;
          DATA[k].piste = typeof parsed[k].piste === "string" ? parsed[k].piste : "";
          DATA[k].arbitre = typeof parsed[k].arbitre === "string" ? parsed[k].arbitre : "";
          DATA[k].scores = parsed[k].scores && typeof parsed[k].scores === "object" ? parsed[k].scores : {};
          if (parsed[k].seeds && typeof parsed[k].seeds === "object" && Object.keys(parsed[k].seeds).length > 0) {
            DATA[k].seeds = parsed[k].seeds;
            DATA[k].active = true;
          }
          if (Array.isArray(parsed[k].pairs32) && parsed[k].pairs32.length > 0) {
            DATA[k].pairs32 = parsed[k].pairs32;
          }
          if (Array.isArray(parsed[k].pairs16) && parsed[k].pairs16.length > 0) {
            DATA[k].pairs16 = parsed[k].pairs16;
          }
        }
      });
      if (matched && (!DATA[currentTab] || !DATA[currentTab].active)) {
        const firstActive = ORDER.find(k => DATA[k] && DATA[k].active);
        if (firstActive) currentTab = firstActive;
      }
      return matched;
