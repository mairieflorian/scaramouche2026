<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scaramouche 2026 — Suivi en direct des tableaux</title>
  <style>
    :root {
      --bg: #eef2f6;
      --paper: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --line: #1e293b;
      --grid: #cbd5e1;
      --accent: #0f766e;
      --accent-soft: #f0fdfa;
      --win: #dcfce7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.4;
    }

    .app-header {
      background: var(--ink);
      color: #ffffff;
      padding: 16px;
      border-bottom: 4px solid var(--accent);
    }

    .container {
      max-width: 1380px;
      margin: 0 auto;
    }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .kicker {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #5eead4;
    }

    .app-title {
      font-size: 21px;
      font-weight: 800;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .mode-badge {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
    }

    .mode-badge.viewer {
      background: rgba(148, 163, 184, 0.22);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.45);
    }

    .mode-badge.editor {
      background: rgba(20, 184, 166, 0.25);
      color: #5eead4;
      border: 1px solid #2dd4bf;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-unlock {
      background: #0d9488;
      border-color: #2dd4bf;
      color: #ffffff;
    }

    .event-bar {
      background: #1e293b;
      padding: 10px 16px;
    }

    .event-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .event-btn {
      padding: 8px 16px;
      border-radius: 7px;
      border: 1.5px solid #475569;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .event-btn.active {
      background: #14b8a6;
      color: #042f2e;
      border-color: #14b8a6;
    }

    .sub-bar {
      background: var(--paper);
      border-bottom: 1.5px solid var(--grid);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .sub-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1.5px solid var(--line);
      background: #f8fafc;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--ink);
      color: #ffffff;
    }

    .search-input {
      padding: 7px 12px;
      border: 1.5px solid #94a3b8;
      border-radius: 6px;
      font-size: 13px;
      min-width: 240px;
    }

    main {
      padding: 20px 16px 48px;
    }

    .sheet {
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
    }

    .sheet-header {
      display: grid;
      grid-template-columns: 1.2fr 1.5fr 1fr;
      border: 1.5px solid var(--line);
      margin-bottom: 14px;
    }

    .h-box {
      padding: 10px 12px;
      border-right: 1.5px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .h-box:last-child {
      border-right: none;
    }

    .tour-heading {
      font-size: 20px;
      font-weight: 800;
    }

    .inline-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .inline-field input {
      border: 1px solid #94a3b8;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      background: #f8fafc;
    }

    .inline-field input:disabled {
      background: #f1f5f9;
      border-color: transparent;
    }

    .inline-field input.piste-input {
      width: 58px;
      text-align: center;
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .inline-field input.ref-input {
      flex: 1;
      min-width: 110px;
    }

    .event-center-title {
      font-size: 16px;
      font-weight: 800;
      text-align: center;
    }

    .event-center-sub {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      color: var(--muted);
    }

    .right-meta {
      text-align: right;
      font-size: 13px;
      font-weight: 800;
    }

    .right-date {
      text-align: right;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .bouts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .bouts-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .bouts-hint {
      font-size: 11.5px;
      color: var(--muted);
    }

    .bracket-scroll {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .bracket-board {
      min-width: 1040px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      align-items: stretch;
    }

    .round-col {
      display: flex;
      flex-direction: column;
    }

    .round-header {
      background: var(--ink);
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 7px 8px;
      border-radius: 5px;
      text-align: center;
      margin-bottom: 10px;
    }

    .round-matches {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 8px;
    }

    .de-match {
      border: 1.5px solid var(--line);
      border-radius: 5px;
      background: #f8fafc;
      overflow: hidden;
    }

    .de-match-top {
      background: #e2e8f0;
      padding: 2px 7px;
      font-size: 10.5px;
      font-weight: 800;
      color: #334155;
      display: flex;
      justify-content: space-between;
      gap: 4px;
    }

    .de-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      padding: 5px 7px;
      background: #ffffff;
      border-top: 1px solid #cbd5e1;
      font-size: 11.5px;
    }

    .de-slot.winner-slot {
      background: var(--win);
    }

    .de-slot.bye-slot {
      background: #f8fafc;
      color: var(--muted);
      font-style: italic;
    }

    .row-highlight {
      background: #fef9c3 !important;
    }

    .de-fencer {
      min-width: 0;
      flex: 1;
    }

    .de-seed {
      font-weight: 800;
      color: var(--muted);
      margin-right: 3px;
    }

    .de-name {
      font-weight: 800;
    }

    .de-club {
      display: block;
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
    }

    .de-score-input {
      width: 40px;
      height: 22px;
      text-align: center;
      border: 1.5px solid #64748b;
      border-radius: 4px;
      font-weight: 800;
      font-size: 11.5px;
      background: #ffffff;
    }

    .de-score-read {
      min-width: 22px;
      text-align: center;
      font-weight: 800;
      font-size: 11.5px;
    }

    .champion-box {
      border: 2px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 6px;
      padding: 12px;
      text-align: center;
    }

    .champion-label {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .champion-name {
      font-size: 14px;
      font-weight: 800;
      color: var(--ink);
    }

    .champion-club {
      font-size: 11.5px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table.rank-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.rank-table th,
    table.rank-table td {
      border: 1px solid var(--grid);
      padding: 8px 10px;
    }

    table.rank-table th {
      background: #f1f5f9;
      text-align: left;
      font-size: 11.5px;
      text-transform: uppercase;
    }

    table.rank-table td.num,
    table.rank-table th.num {
      text-align: center;
    }

    @media (max-width: 740px) {
      .sheet-header {
        grid-template-columns: 1fr;
      }
      .h-box {
        border-right: none;
        border-bottom: 1.5px solid var(--line);
      }
      .h-box:last-child {
        border-bottom: none;
      }
      .right-meta,
      .right-date {
        text-align: left;
      }
    }

    @media print {
      .app-header,
      .event-bar,
      .sub-bar,
      .bouts-hint {
        display: none !important;
      }
      body {
        background: #ffffff;
      }
      .sheet {
        box-shadow: none;
      }
    }
  </style>
</head>

            arbitre: typeof raw[key].arbitre === "string" ? raw[key].arbitre : "",
            seeds: hasSeeds ? raw[key].seeds : base[key].seeds,
            t32Seeds: Array.isArray(raw[key].t32Seeds) && raw[key].t32Seeds.length ? raw[key].t32Seeds : base[key].t32Seeds,
            t16Seeds: Array.isArray(raw[key].t16Seeds) && raw[key].t16Seeds.length ? raw[key].t16Seeds : base[key].t16Seeds,
            matches: raw[key].matches && typeof raw[key].matches === "object" ? raw[key].matches : {}
          };
          if (hasSeeds) base[key].enabled = true;
        }
      });
      return base;
    }

    async function loadRemoteJson(showAlert = false) {
      try {
        const res = await fetch(`./resultats.json?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) {
          if (showAlert) alert("Aucun fichier resultats.json trouvé sur le serveur.");
          return;
        }
        const remoteData = await res.json();
        state = mergeImportedState(remoteData);
        if (!state[activeEventId]?.enabled) {
          const first = EVENT_ORDER.find((id) => state[id]?.enabled);
          if (first) activeEventId = first;
        }
        renderAll();
        if (showAlert) alert("Résultats chargés depuis resultats.json.");
      } catch {
        if (showAlert) alert("Impossible de lire resultats.json.");
      }
    }

    function requestEditorMode() {
      const code = prompt("Entrez le code PIN pour activer la saisie des résultats :");
      if (code === null) return;
      if (code.trim() === EDITOR_PIN) {
        isEditor = true;
        renderAll();
      } else {
        alert("Code PIN incorrect. Mode Spectateur (lecture seule) conservé.");
      }
    }

    function lockViewerMode() {
      isEditor = false;
      renderAll();
    }

    function renderHeaderActions() {
      const wrap = document.getElementById("headerActions");
      if (!isEditor) {
        wrap.innerHTML = `
          <span class="mode-badge viewer">Mode Spectateur (lecture seule)</span>
          <button class="btn-ghost" onclick="loadRemoteJson(true)">Actualiser en ligne</button>
          <button class="btn-ghost" onclick="window.print()">Imprimer</button>
          <button class="btn-ghost btn-unlock" onclick="requestEditorMode()">Mode Saisie (PIN)</button>
        `;
      } else {
        wrap.innerHTML = `
          <span class="mode-badge editor">Mode Saisie actif</span>
          <button class="btn-ghost" onclick="loadRemoteJson(true)">Recharger JSON</button>
          <button class="btn-ghost" onclick="exportJson()">Exporter resultats.json</button>
          <label class="btn-ghost" style="cursor:pointer;">
            Importer JSON
            <input type="file" accept=".json" style="display:none;" onchange="importJson(event)" />
          </label>
          <button class="btn-ghost" onclick="window.print()">Imprimer</button>
          <button class="btn-ghost" onclick="lockViewerMode()">Verrouiller</button>
        `;
      }
    }

    function getMatchWinner(fA, fB, sA, sB, byeWinner) {
      if (byeWinner === "a" && fA) return fA;
      if (byeWinner === "b" && fB) return fB;
      if (sA === "" || sB === "" || sA === undefined || sB === undefined) return null;
      const nA = Number(sA);
      const nB = Number(sB);
      if (Number.isNaN(nA) || Number.isNaN(nB) || nA === nB) return null;
      if (nA > nB && fA) return fA;
      if (nB > nA && fB) return fB;
      return null;
    }

    function resolvePairs(pairs, prefix, seeds, matches) {
      return (pairs || []).map(([rawA, rawB, byeWinner], idx) => {
        const key = `${prefix}.${idx + 1}`;
        const fA = typeof rawA === "number" ? seeds[rawA] : rawA || null;
        const fB = typeof rawB === "number" ? seeds[rawB] : rawB || null;
        const mItem = matches[key] || { aScore: "", bScore: "" };
        const winner = getMatchWinner(fA, fB, mItem.aScore, mItem.bScore, byeWinner || "");
        return {
          key,
          fA,
          fB,
          aScore: mItem.aScore ?? "",
          bScore: mItem.bScore ?? "",
          winner,
          byeWinner: byeWinner || ""
        };
      });
    }

    function computeBracketRounds(ev) {
      const seeds = ev.seeds || {};
      const matches = ev.matches || {};

      if (ev.bracketSize === 32) {
        const t32 = resolvePairs(ev.t32Seeds, "1-32", seeds, matches);
        const t16Pairs = [];
        for (let i = 0; i < 16; i += 2) t16Pairs.push([t32[i]?.winner || null, t32[i + 1]?.winner || null, ""]);
        const t16 = resolvePairs(t16Pairs, "1-16", seeds, matches);
        const t8Pairs = [];
        for (let i = 0; i < 8; i += 2) t8Pairs.push([t16[i]?.winner || null, t16[i + 1]?.winner || null, ""]);
        const t8 = resolvePairs(t8Pairs, "1-8", seeds, matches);
        const sfPairs = [];
        for (let i = 0; i < 4; i += 2) sfPairs.push([t8[i]?.winner || null, t8[i + 1]?.winner || null, ""]);
        const sf = resolvePairs(sfPairs, "1-4", seeds, matches);
        return {
          rounds: [
            { title: "Tableau de 32", items: t32 },
            { title: "Tableau de 16", items: t16 },
            { title: "Tableau de 8", items: t8 }
          ],
          qualifiersLabel: "Qualifiés Demi-finale",
          qualifiers: sf.map((m) => m.winner).filter(Boolean),
          qualifierCount: 4,
          qualifierPrefix: "Demi-finaliste"
        };
      }

      const t16 = resolvePairs(ev.t16Seeds, "1-16", seeds, matches);
      const t8Pairs = [
        [t16[0]?.winner || null, t16[1]?.winner || null, ""],
        [t16[2]?.winner || null, t16[3]?.winner || null, ""],
        [t16[4]?.winner || null, t16[5]?.winner || null, ""],
        [t16[6]?.winner || null, t16[7]?.winner || null, ""]
      ];
      const t8 = resolvePairs(t8Pairs, "1-8", seeds, matches);
      const sfPairs = [
        [t8[0]?.winner || null, t8[1]?.winner || null, ""],
        [t8[2]?.winner || null, t8[3]?.winner || null, ""]
      ];
      const sf = resolvePairs(sfPairs, "1-4", seeds, matches);
      return {
        rounds: [
          { title: "Tableau de 16", items: t16 },
          { title: "Tableau de 8", items: t8 },
          { title: "Demi-finale", items: sf }
        ],
        qualifiersLabel: "Qualifiées Finale",
        qualifiers: sf.map((m) => m.winner).filter(Boolean),
        qualifierCount: 2,
        qualifierPrefix: "Finaliste"
      };
    }

    function matchesSearch(fencer, q) {
      if (!q || !fencer) return false;
      return (
        (fencer.nom && fencer.nom.toLowerCase().includes(q)) ||
        (fencer.prenom && fencer.prenom.toLowerCase().includes(q)) ||
        (fencer.club && fencer.club.toLowerCase().includes(q))
      );
    }

    function renderEventTabs() {
      const wrap = document.getElementById("eventTabs");
      const enabledEvents = EVENT_ORDER.map((id) => state[id]).filter((ev) => ev && ev.enabled);
      wrap.innerHTML = enabledEvents
        .map(
          (ev) => `
          <button
            class="event-btn ${ev.id === activeEventId ? "active" : ""}"
            onclick="selectEvent('${ev.id}')"
          >
            ${ev.shortTitle}
          </button>
        `
        )
        .join("");
    }

    function renderFilterPills() {
      const ev = state[activeEventId];
      const count = Object.keys(ev.seeds || {}).length;
      document.getElementById("filterPills").innerHTML = `
        <button class="pill-btn ${activeView === "bracket" ? "active" : ""}" onclick="selectView('bracket')">
          Tableau éliminatoire
        </button>
        <button class="pill-btn ${activeView === "seeds" ? "active" : ""}" onclick="selectView('seeds')">
          Tireurs / Tireuses (${count})
        </button>
      `;
    }

    function renderBracketMatchCard(match, q) {
      const isBye = Boolean(match.byeWinner);
      const aIsWinner = match.winner && match.fA && match.winner.seed === match.fA.seed;
      const bIsWinner = match.winner && match.fB && match.winner.seed === match.fB.seed;
      const hitA = matchesSearch(match.fA, q);
      const hitB = matchesSearch(match.fB, q);

      const renderSide = (fencer, scoreVal, side, isWin, isHit) => {
        if (!fencer && isBye) {
          return `<div class="de-slot bye-slot"><span>Exempté</span></div>`;
        }
        if (!fencer) {
          return `<div class="de-slot bye-slot"><span>En attente du tour précédent</span></div>`;
        }
        const inputId = `score-${activeEventId}-${match.key}-${side}`;
        const scoreControl = isEditor
          ? `<input id="${inputId}" type="number" min="0" max="15" class="de-score-input" value="${scoreVal}" oninput="updateBracketScore('${match.key}', '${side}', this.value)" />`
          : `<span class="de-score-read">${scoreVal !== "" ? scoreVal : "·"}</span>`;

        return `
          <div class="de-slot ${isWin ? "winner-slot" : ""} ${isHit ? "row-highlight" : ""}">
            <div class="de-fencer">
              <span class="de-seed">${fencer.seed}</span>
              <span class="de-name">${fencer.nom}</span>
              <span>${fencer.prenom}</span>
              ${fencer.club ? `<span class="de-club">${fencer.club}</span>` : ""}
            </div>
            ${scoreControl}
          </div>
        `;
      };

      return `
        <div class="de-match">
          <div class="de-match-top">
            <span>${match.key}</span>
            <span>${match.winner ? `Qualifié(e) : ${match.winner.nom}` : isBye ? "Direct" : ""}</span>
          </div>
          ${renderSide(match.fA, match.aScore, "a", aIsWinner, hitA)}
          ${renderSide(match.fB, match.bScore, "b", bIsWinner, hitB)}
        </div>
      `;
    }

    function renderContent() {
      const ev = state[activeEventId];
      const main = document.getElementById("mainContent");
      const q = searchQuery.trim().toLowerCase();

      if (activeView === "seeds") {
        const rows = Object.values(ev.seeds || {})
          .sort((a, b) => a.seed - b.seed)
          .filter((f) => !q || matchesSearch(f, q))
          .map(
            (f) => `
            <tr>
              <td class="num"><strong>${f.seed}</strong></td>
              <td><strong>${f.nom}</strong> ${f.prenom}</td>
              <td>${f.club}</td>
            </tr>
          `
          )
          .join("");

        main.innerHTML = `
          <article class="sheet">
            <div class="sheet-header">
              <div class="h-box">
                <div class="tour-heading">${ev.tour}</div>
                <div class="inline-field"><span>${Object.keys(ev.seeds || {}).length} participants</span></div>
              </div>
              <div class="h-box">
                <div class="event-center-title">${ev.epreuve}</div>
                <div class="event-center-sub">Scaramouche 2026 • ${ev.tour}</div>
              </div>
              <div class="h-box">
                <div class="right-meta">${ev.club}</div>
                <div class="right-date">${ev.date}</div>
              </div>
            </div>
            <div class="table-wrap">
              <table class="rank-table">
                <thead>
                  <tr>
                    <th class="num">N°</th>
                    <th>Nom & Prénom</th>
                    <th>Club</th>
                  </tr>
                </thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </article>
        `;
        return;
      }

      const { rounds, qualifiersLabel, qualifiers, qualifierCount, qualifierPrefix } = computeBracketRounds(ev);

      const roundColsHtml = rounds
        .map(
          (r) => `
          <div class="round-col">
            <div class="round-header">${r.title}</div>
            <div class="round-matches">
              ${r.items.map((m) => renderBracketMatchCard(m, q)).join("")}
            </div>
          </div>
        `
        )
        .join("");

      const qualifiersColHtml = `
        <div class="round-col">
          <div class="round-header">${qualifiersLabel}</div>
          <div class="round-matches">
            ${Array.from({ length: qualifierCount })
              .map((_, idx) => {
                const f = qualifiers[idx];
                return `
                  <div class="champion-box">
                    <div class="champion-label">${qualifierPrefix} ${idx + 1}</div>
                    ${
                      f
                        ? `<div class="champion-name">${f.seed}. ${f.nom} ${f.prenom}</div>
                           <div class="champion-club">${f.club}</div>`
                        : `<div class="champion-club">À déterminer</div>`
                    }
                  </div>
                `;
              })
              .join("")}
          </div>
        </div>
      `;

      main.innerHTML = `
        <article class="sheet">
          <div class="sheet-header">
            <div class="h-box">
              <div class="tour-heading">${ev.tour}</div>
              <div class="inline-field">
                <span>Piste :</span>
                <input type="text" class="piste-input" value="${ev.piste || ""}" placeholder="${isEditor ? "N°" : "-"}" ${isEditor ? "" : "disabled"} oninput="updateBracketMeta('piste', this.value)" />
              </div>
            </div>
            <div class="h-box">
              <div class="inline-field">
                <span>Arbitre :</span>
                <input type="text" class="ref-input" value="${ev.arbitre || ""}" placeholder="${isEditor ? "Nom de l'arbitre" : "Non renseigné"}" ${isEditor ? "" : "disabled"} oninput="updateBracketMeta('arbitre', this.value)" />
              </div>
              <div class="event-center-title">${ev.epreuve}</div>
              <div class="event-center-sub">${rounds.map((r) => r.title).join(" • ")}</div>
            </div>
            <div class="h-box">
              <div class="right-meta">${ev.club}</div>
              <div class="right-date">${ev.date}</div>
            </div>
          </div>

          <div class="bouts-header">
            <span class="bouts-title">Tableau éliminatoire — ${ev.epreuve}</span>
            <span class="bouts-hint">${
              isEditor
                ? "Saisie active : les vainqueurs avancent automatiquement au tour suivant."
                : "Consultation seule — activez le Mode Saisie (PIN) pour modifier les scores."
            }</span>
          </div>

          <div class="bracket-scroll">
            <div class="bracket-board">
              ${roundColsHtml}
              ${qualifiersColHtml}
            </div>
          </div>
        </article>
      `;
    }

    function selectEvent(id) {
      if (!state[id] || !state[id].enabled) return;
      activeEventId = id;
      activeView = "bracket";
      renderAll();
    }

    function selectView(view) {
      activeView = view;
      renderFilterPills();
      renderContent();
    }

    function updateBracketMeta(field, value) {
      if (!isEditor) return;
      state[activeEventId][field] = value;
    }

    function updateBracketScore(matchKey, side, value) {
      if (!isEditor) return;
      const ev = state[activeEventId];
      if (!ev.matches[matchKey]) ev.matches[matchKey] = { aScore: "", bScore: "" };
      if (side === "a") ev.matches[matchKey].aScore = value;
      if (side === "b") ev.matches[matchKey].bScore = value;

      const activeEl = document.activeElement;
      const focusId = activeEl ? activeEl.id : "";
      const selStart = activeEl && typeof activeEl.selectionStart === "number" ? activeEl.selectionStart : null;

      renderContent();

      if (focusId) {
        const restored = document.getElementById(focusId);
        if (restored) {
          restored.focus();
          if (selStart !== null) {
            try { restored.setSelectionRange(selStart, selStart); } catch {}
          }
        }
      }
    }

    function exportJson() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "resultats.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function importJson(e) {
      if (!isEditor) return;
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.
