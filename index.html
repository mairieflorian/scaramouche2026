<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scaramouche 2026 — Poules & Tableaux Éliminatoires</title>
  <style>
    :root {
      --bg: #eef2f6;
      --paper: #ffffff;
      --ink: #0f172a;
      --muted: #475569;
      --line: #1e293b;
      --grid: #cbd5e1;
      --diag: #e2e8f0;
      --accent: #0f766e;
      --accent-soft: #f0fdfa;
      --win: #dcfce7;
      --win-ink: #166534;
      --loss: #fee2e2;
      --loss-ink: #991b1b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.4;
    }

    .app-header {
      background: var(--ink);
      color: #ffffff;
      padding: 16px;
      border-bottom: 4px solid var(--accent);
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    .header-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
    }

    .kicker {
      font-size: 11.5px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #5eead4;
    }

    .app-title {
      font-size: 21px;
      font-weight: 800;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .mode-badge {
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .mode-badge.viewer {
      background: rgba(148, 163, 184, 0.22);
      color: #e2e8f0;
      border: 1px solid rgba(148, 163, 184, 0.45);
    }

    .mode-badge.editor {
      background: rgba(20, 184, 166, 0.25);
      color: #5eead4;
      border: 1px solid #2dd4bf;
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 7px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn-unlock {
      background: #0d9488;
      border-color: #2dd4bf;
      color: #ffffff;
    }

    .btn-unlock:hover {
      background: #0f766e;
    }

    .btn-danger {
      background: rgba(220, 38, 38, 0.25);
      border-color: rgba(248, 113, 113, 0.45);
      color: #fecaca;
    }

    .event-bar {
      background: #1e293b;
      padding: 10px 16px;
    }

    .event-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .event-btn {
      padding: 8px 16px;
      border-radius: 7px;
      border: 1.5px solid #475569;
      background: #0f172a;
      color: #cbd5e1;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .event-btn.active {
      background: #14b8a6;
      color: #042f2e;
      border-color: #14b8a6;
    }

    .sub-bar {
      background: var(--paper);
      border-bottom: 1.5px solid var(--grid);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }

    .sub-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill-btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1.5px solid var(--line);
      background: #f8fafc;
      color: var(--ink);
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }

    .pill-btn.active {
      background: var(--ink);
      color: #ffffff;
    }

    .pill-btn.ranking-pill.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .search-input {
      padding: 7px 12px;
      border: 1.5px solid #94a3b8;
      border-radius: 6px;
      font-size: 13px;
      min-width: 230px;
    }

    main {
      padding: 20px 16px 48px;
    }

    .sheets-stack {
      display: flex;
      flex-direction: column;
      gap: 26px;
    }

    .sheet {
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
    }

    .sheet-header {
      display: grid;
      grid-template-columns: 1.2fr 1.5fr 1fr;
      border: 1.5px solid var(--line);
      margin-bottom: 14px;
    }

    .h-box {
      padding: 10px 12px;
      border-right: 1.5px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    .h-box:last-child {
      border-right: none;
    }

    .pool-heading {
      font-size: 20px;
      font-weight: 800;
    }

    .inline-field {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 700;
    }

    .inline-field input {
      border: 1px solid #94a3b8;
      border-radius: 4px;
      padding: 3px 7px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink);
      background: #f8fafc;
    }

    .inline-field input:disabled {
      background: #f1f5f9;
      color: var(--ink);
      border-color: transparent;
      padding-left: 2px;
    }

    .inline-field input.piste-input {
      width: 56px;
      text-align: center;
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }

    .inline-field input.piste-input:disabled {
      background: var(--accent-soft);
      border-color: var(--accent);
      padding-left: 4px;
    }

    .inline-field input.ref-input {
      flex: 1;
      min-width: 110px;
    }

    .event-center-title {
      font-size: 16px;
      font-weight: 800;
      text-align: center;
    }

    .event-center-sub {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      color: var(--muted);
    }

    .right-meta {
      text-align: right;
      font-size: 13px;
      font-weight: 800;
    }

    .right-date {
      text-align: right;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .table-wrap {
      overflow-x: auto;
      margin-bottom: 16px;
    }

    table.cross-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      min-width: 820px;
    }

    table.cross-table th,
    table.cross-table td {
      border: 1px solid var(--line);
      padding: 6px 7px;
    }

    table.cross-table thead th {
      background: #f1f5f9;
      text-align: center;
      font-weight: 800;
    }

    table.cross-table thead th.left {
      text-align: left;
    }

    .f-name-cell {
      white-space: nowrap;
    }

    .f-num {
      display: inline-block;
      width: 18px;
      font-weight: 800;
    }

    .f-nom {
      font-weight: 800;
    }

    .f-club {
      font-size: 11px;
      color: var(--muted);
      margin-left: 6px;
      font-weight: 600;
    }

    .matrix-cell {
      width: 38px;
      height: 30px;
      text-align: center;
      font-weight: 800;
      font-size: 12px;
    }

    .matrix-diag {
      background: var(--diag);
      color: #64748b;
    }

    .matrix-win {
      background: var(--win);
      color: var(--win-ink);
    }

    .matrix-loss {
      background: var(--loss);
      color: var(--loss-ink);
    }

    .stat-col {
      width: 44px;
      text-align: center;
      font-weight: 700;
      background: #fafafa;
    }

    .stat-rank {
      width: 44px;
      text-align: center;
      font-weight: 800;
      background: #f1f5f9;
    }

    .sig-col {
      width: 96px;
      color: #94a3b8;
      font-size: 11px;
      font-style: italic;
      text-align: center;
    }

    .row-highlight {
      background: #fef9c3 !important;
    }

    .bouts-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .bouts-title {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .bouts-hint {
      font-size: 11.5px;
      color: var(--muted);
    }

    .bouts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(335px, 1fr));
      gap: 8px;
    }

    .bout-box {
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 8px;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 12px;
    }

    .bout-box.done {
      background: #ffffff;
      border-color: #64748b;
    }

    .bout-num {
      background: var(--ink);
      color: #ffffff;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .bout-pair {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
    }

    .f-tag {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }

    .f-tag.winner {
      color: var(--win-ink);
      font-weight: 800;
    }

    .score-zone {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
    }

    .score-zone input[type="number"] {
      width: 38px;
      height: 24px;
      text-align: center;
      border: 1.5px solid #64748b;
      border-radius: 4px;
      font-weight: 800;
      font-size: 12.5px;
      background: #ffffff;
    }

    .score-zone input[type="number"]:disabled {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: var(--ink);
    }

    .score-read {
      min-width: 24px;
      text-align: center;
      font-weight: 800;
      font-size: 12.5px;
      color: var(--ink);
    }

    .prio-btn {
      font-size: 10px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 3px;
      border: 1px solid #94a3b8;
      background: #e2e8f0;
      color: #334155;
      cursor: pointer;
    }

    .prio-btn:disabled {
      cursor: default;
      opacity: 0.85;
    }

    .prio-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
    }

    .ranking-card {
      background: var(--paper);
      border: 2px solid var(--line);
      border-radius: 6px;
      padding: 16px;
    }

    .ranking-card h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .ranking-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    table.rank-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.rank-table th,
    table.rank-table td {
      border: 1px solid var(--grid);
      padding: 8px 10px;
    }

    table.rank-table th {
      background: #f1f5f9;
      text-align: left;
      font-size: 11.5px;
      text-transform: uppercase;
    }

    table.rank-table td.num,
    table.rank-table th.num {
      text-align: center;
    }

    /* Tableau éliminatoire T16 */
    .bracket-scroll {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .bracket-board {
      min-width: 1020px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .round-col {
      display: flex;
      flex-direction: column;
    }

    .round-header {
      background: var(--ink);
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 8px 10px;
      border-radius: 5px;
      text-align: center;
      margin-bottom: 12px;
    }

    .round-matches {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 10px;
    }

    .de-match {
      border: 1.5px solid var(--line);
      border-radius: 6px;
      background: #f8fafc;
      overflow: hidden;
    }

    .de-match-top {
      background: #e2e8f0;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      color: #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .de-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      background: #ffffff;
      border-top: 1px solid #cbd5e1;
      font-size: 12px;
    }

    .de-slot.winner-slot {
      background: var(--win);
    }

    .de-slot.bye-slot {
      background: #f8fafc;
      color: var(--muted);
      font-style: italic;
    }

    .de-fencer {
      min-width: 0;
      flex: 1;
    }

    .de-seed {
      font-weight: 800;
      color: var(--muted);
      margin-right: 4px;
    }

    .de-name {
      font-weight: 800;
    }

    .de-club {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      font-weight: 600;
    }

    .de-score-input {
      width: 40px;
      height: 24px;
      text-align: center;
      border: 1.5px solid #64748b;
      border-radius: 4px;
      font-weight: 800;
      font-size: 12px;
      background: #ffffff;
    }

    .de-score-input:disabled {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: var(--ink);
    }

    .de-score-read {
      min-width: 24px;
      text-align: center;
      font-weight: 800;
      font-size: 12px;
    }

    .champion-box {
      border: 2px solid var(--accent);
      background: var(--accent-soft);
      border-radius: 6px;
      padding: 14px;
      text-align: center;
    }

    .champion-label {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .champion-name {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }

    .champion-club {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      margin-top: 2px;
    }

    .de-list-card {
      margin-top: 18px;
      border-top: 1.5px solid var(--grid);
      padding-top: 14px;
    }

    @media (max-width: 740px) {
      .sheet-header {
        grid-template-columns: 1fr;
      }
      .h-box {
        border-right: none;
        border-bottom: 1.5px solid var(--line);
      }
      .h-box:last-child {
        border-bottom: none;
      }
      .right-meta,
      .right-date {
        text-align: left;
      }
    }

    @media print {
      .app-header,
      .event-bar,
      .sub-bar,
      .bouts-hint {
        display: none !important;
      }
      body {
        background: #ffffff;
        padding: 0;
      }
      .sheet {
        box-shadow: none;
        break-inside: avoid;
        margin-bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="container header-row">
      <div>

      <div class="header-actions" id="headerActions"></div>
    </div>

  <div class="event-bar">
    <div class="container event-tabs" id="eventTabs"></div>

  <div class="sub-bar">
    <div class="container sub-row">
      <div class="filter-pills" id="filterPills"></div>
      <input
        type="text"
        id="searchInput"

        placeholder="Rechercher tireur/tireuse ou club..."
      />
    </div>
  </div>

  <main>
    <div class="container" id="mainContent"></div>
  </main>
